<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="stylesheet" href="/css/setup.css">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الإعداد الأولي - منصة ماتريكس برو</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { font-family: 'Cairo', 'Rubik', sans-serif; box-sizing: border-box; }
body { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 12px; }
.setup-card { background: rgba(255,255,255,0.97); backdrop-filter: blur(20px); border-radius: 32px; padding: 24px; width: 100%; max-width: 560px; box-shadow: 0 32px 80px rgba(0,0,0,0.4); animation: slideUp 0.6s ease; }
@media (min-width: 640px) { .setup-card { padding: 40px; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
.logo { width: 70px; height: 70px; border-radius: 20px; background: linear-gradient(135deg, #f59e0b, #d97706); display: flex; align-items: center; justify-content: center; font-size: 32px; margin: 0 auto 16px; box-shadow: 0 8px 32px rgba(245,158,11,0.3); }
.step-indicator { display: flex; justify-content: center; gap: 8px; margin-bottom: 28px; }
.step-dot { width: 10px; height: 10px; border-radius: 50%; background: #e5e7eb; transition: all 0.3s; }
.step-dot.active { background: #f59e0b; width: 32px; border-radius: 5px; }
.step-dot.done { background: #10b981; }
.field-group { margin-bottom: 18px; }
.field-group label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
.field-group input { width: 100%; padding: 12px 16px; border: 2px solid #e5e7eb; border-radius: 14px; font-size: 14px; outline: none; transition: all 0.2s; background: #f9fafb; }
.field-group input:focus { border-color: #f59e0b; background: #fff; box-shadow: 0 0 0 4px rgba(245,158,11,0.1); }
.field-group input.error { border-color: #ef4444; background: #fef2f2; }
.field-group .hint { font-size: 11px; color: #9ca3af; margin-top: 4px; }
.field-group .error-msg { font-size: 11px; color: #ef4444; margin-top: 4px; display: none; }
.photo-upload { width: 100px; height: 100px; border-radius: 50%; border: 3px dashed #d1d5db; display: flex; align-items: center; justify-content: center; cursor: pointer; margin: 0 auto 16px; overflow: hidden; transition: all 0.3s; background: #f9fafb; }
.photo-upload:hover { border-color: #f59e0b; background: #fffbeb; }
.photo-upload img { width: 100%; height: 100%; object-fit: cover; }
.photo-upload .placeholder { font-size: 32px; color: #9ca3af; }
.btn-primary { width: 100%; padding: 14px; background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; font-weight: 700; font-size: 15px; border: none; border-radius: 14px; cursor: pointer; transition: all 0.2s; box-shadow: 0 8px 24px rgba(245,158,11,0.3); }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(245,158,11,0.4); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.password-strength { height: 4px; border-radius: 2px; margin-top: 8px; transition: all 0.3s; background: #e5e7eb; overflow: hidden; }
.password-strength .bar { height: 100%; border-radius: 2px; transition: all 0.3s; width: 0%; }
.step-content { display: none; }
.step-content.active { display: block; }
.secured-badge { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #6b7280; margin-top: 16px; justify-content: center; }
.secured-badge svg { width: 14px; height: 14px; }
/* ===== استجابة للشاشات الصغيرة ===== */
@media (max-width: 480px) {
  body { padding: 6px; }
  .setup-card { padding: 18px; border-radius: 24px; }
  .photo-upload { width: 80px; height: 80px; }
  h1 { font-size: 20px !important; }
}
@media (max-width: 374px) {
  .setup-card { padding: 14px; }
}
</style>
</head>
<body>
<div class="setup-card">
  <div class="logo">🔐</div>
  <h1 class="text-2xl font-bold text-center text-gray-900 mb-1">الإعداد الأولي</h1>
  <p class="text-sm text-gray-500 text-center mb-6">أنشئ حساب المشرف لتشغيل المنصة</p>

  <div class="step-indicator">
    <div class="step-dot active" id="step-dot-0"></div>
    <div class="step-dot" id="step-dot-1"></div>
    <div class="step-dot" id="step-dot-2"></div>
    <div class="step-dot" id="step-dot-3"></div>
  </div>

  <!-- Step 0: Username & Password -->
  <div class="step-content active" id="step-0">
    <div class="field-group">
      <label>اسم المستخدم</label>
      <input type="text" id="s-username" placeholder="أدخل اسم المستخدم" autocomplete="off">
      <div class="hint">سيستخدم لتسجيل الدخول إلى لوحة الإدارة</div>
    </div>
    <div class="field-group">
      <label>كلمة المرور</label>
      <input type="password" id="s-password" placeholder="كلمة مرور قوية (8 أحرف على الأقل)" oninput="checkPasswordStrength(this.value)">
      <div class="password-strength"><div class="bar" id="pw-bar"></div></div>
      <div id="pw-hint" class="hint">استخدم حروف كبيرة وصغيرة وأرقام ورموز من دون مسافات</div>
    </div>
    <div class="field-group">
      <label>تأكيد كلمة المرور</label>
      <input type="password" id="s-password2" placeholder="أعد إدخال كلمة المرور" oninput="checkPasswordMatch()">
      <div id="pw-match" class="hint"></div>
    </div>
    <button class="btn-primary mt-2" onclick="nextStep(1)">متابعة →</button>
    <button onclick="window.location.href='/admin.html'" class="w-full mt-2 py-3 rounded-2xl text-sm font-bold text-gray-500 hover:text-gray-700 hover:bg-gray-100 transition-all">
      ⏭ تخطي وفتح لوحة الإدارة
    </button>
  </div>

  <!-- Step 1: Personal Info -->
  <div class="step-content" id="step-1">
    <div class="field-group">
      <label>البريد الإلكتروني</label>
      <input type="email" id="s-email" placeholder="admin@example.com">
    </div>
    <div class="field-group">
      <label>رقم الهاتف</label>
      <input type="tel" id="s-phone" placeholder="0912345678">
    </div>
    <div class="field-group">
      <label>المدينة</label>
      <input type="text" id="s-city" placeholder="طرابلس">
    </div>
    <div class="flex gap-3 mt-4">
      <button class="btn-primary !bg-gray-200 !text-gray-600 !shadow-none hover:!bg-gray-300" onclick="prevStep(0)" style="flex:1">→ رجوع</button>
      <button class="btn-primary" onclick="nextStep(2)" style="flex:1">متابعة →</button>
    </div>
  </div>

  <!-- Step 2: Photo -->
  <div class="step-content" id="step-2">
    <div class="photo-upload" id="photo-upload" onclick="document.getElementById('photo-input').click()">
      <div class="placeholder" id="photo-placeholder">📷</div>
      <img id="photo-preview" class="hidden">
    </div>
    <input type="file" id="photo-input" accept="image/*" class="hidden" onchange="previewPhoto(event)">
    <p class="text-sm text-gray-500 text-center mb-6">اختر صورة شخصية للمشرف (اختياري)</p>
    <div class="flex gap-3 mt-4">
      <button class="btn-primary !bg-gray-200 !text-gray-600 !shadow-none hover:!bg-gray-300" onclick="prevStep(1)" style="flex:1">→ رجوع</button>
      <button class="btn-primary" onclick="nextStep(3)" style="flex:1">متابعة →</button>
    </div>
  </div>

  <!-- Step 3: Confirmation -->
  <div class="step-content" id="step-3">
    <div class="bg-gray-50 rounded-2xl p-5 mb-5 text-sm">
      <div class="flex items-center gap-3 mb-4">
        <div class="w-12 h-12 rounded-full bg-gradient-to-br from-amber-400 to-orange-500 flex items-center justify-center text-white font-bold text-lg" id="confirm-avatar">👤</div>
        <div>
          <div class="font-bold text-gray-900" id="confirm-username">—</div>
          <div class="text-gray-500 text-xs" id="confirm-email">—</div>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-3 text-xs">
        <div><span class="text-gray-400">الهاتف:</span> <span id="confirm-phone" class="font-medium">—</span></div>
        <div><span class="text-gray-400">المدينة:</span> <span id="confirm-city" class="font-medium">—</span></div>
        <div class="col-span-2"><span class="text-gray-400">قوة كلمة المرور:</span> <span id="confirm-pw" class="font-medium text-green-600">—</span></div>
      </div>
    </div>
    <div class="secured-badge mb-4">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
      <span>جميع البيانات ستُشفر وتُحفظ في الخزنة الآمنة (vault)</span>
    </div>
    <button class="btn-primary" id="submit-btn" onclick="submitSetup()">
      <span id="submit-text">✅ إنشاء حساب المشرف</span>
      <span id="submit-loading" class="hidden">⏳ جاري الإنشاء...</span>
    </button>
    <button class="btn-primary !bg-gray-200 !text-gray-600 !shadow-none hover:!bg-gray-300 mt-2" onclick="prevStep(2)" style="flex:1">→ تعديل البيانات</button>
    <button onclick="window.location.href='/admin.html'" class="w-full mt-2 py-3 rounded-2xl text-sm font-bold text-gray-500 hover:text-gray-700 hover:bg-gray-100 transition-all">
      ⏭ تخطي وفتح لوحة الإدارة
    </button>
  </div>
</div>

    <script src="/js/setup-1.js"></script>

<!-- صندوق الحوار التفاعلي الموحد (Custom Dialog) -->
<div id="custom-dialog" class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm hidden" onclick="if(event.target===this)this.classList.add('hidden')">
    <div class="bg-white rounded-3xl w-full max-w-sm shadow-2xl overflow-hidden" style="box-shadow:0 32px 80px rgba(0,0,0,0.18)">
        <div class="p-6 text-center">
            <div id="dialog-icon" class="w-14 h-14 rounded-2xl mx-auto mb-4 flex items-center justify-center"></div>
            <h3 id="dialog-title" class="text-lg font-bold text-gray-900 mb-2"></h3>
            <p id="dialog-message" class="text-sm text-gray-500 mb-5 leading-relaxed"></p>
            <div id="dialog-buttons" class="flex gap-2"></div>
        </div>
    </div>
</div>

</body>
</html>
