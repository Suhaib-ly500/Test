<!doctype html><html lang="ar" dir="rtl"><head><link rel="stylesheet" href="/css/setup.css"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الإعداد الأولي - منصة ماتريكس برو</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet"><style>*{font-family:Cairo,Rubik,sans-serif;box-sizing:border-box}body{background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}.setup-card{background:rgba(255,255,255,.97);backdrop-filter:blur(20px);border-radius:32px;padding:24px;width:100%;max-width:560px;box-shadow:0 32px 80px rgba(0,0,0,.4);animation:slideUp .6s ease}@media (min-width:640px){.setup-card{padding:40px}}@keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}.logo{width:70px;height:70px;border-radius:20px;background:linear-gradient(135deg,#f59e0b,#d97706);display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 16px;box-shadow:0 8px 32px rgba(245,158,11,.3)}.step-indicator{display:flex;justify-content:center;gap:8px;margin-bottom:28px}.step-dot{width:10px;height:10px;border-radius:50%;background:#e5e7eb;transition:all .3s}.step-dot.active{background:#f59e0b;width:32px;border-radius:5px}.step-dot.done{background:#10b981}.field-group{margin-bottom:18px}.field-group label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px}.field-group input{width:100%;padding:12px 16px;border:2px solid #e5e7eb;border-radius:14px;font-size:14px;outline:0;transition:all .2s;background:#f9fafb}.field-group input:focus{border-color:#f59e0b;background:#fff;box-shadow:0 0 0 4px rgba(245,158,11,.1)}.field-group input.error{border-color:#ef4444;background:#fef2f2}.field-group .hint{font-size:11px;color:#9ca3af;margin-top:4px}.field-group .error-msg{font-size:11px;color:#ef4444;margin-top:4px;display:none}.photo-upload{width:100px;height:100px;border-radius:50%;border:3px dashed #d1d5db;display:flex;align-items:center;justify-content:center;cursor:pointer;margin:0 auto 16px;overflow:hidden;transition:all .3s;background:#f9fafb}.photo-upload:hover{border-color:#f59e0b;background:#fffbeb}.photo-upload img{width:100%;height:100%;object-fit:cover}.photo-upload .placeholder{font-size:32px;color:#9ca3af}.btn-primary{width:100%;padding:14px;background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;font-weight:700;font-size:15px;border:none;border-radius:14px;cursor:pointer;transition:all .2s;box-shadow:0 8px 24px rgba(245,158,11,.3)}.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(245,158,11,.4)}.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}.password-strength{height:4px;border-radius:2px;margin-top:8px;transition:all .3s;background:#e5e7eb;overflow:hidden}.password-strength .bar{height:100%;border-radius:2px;transition:all .3s;width:0%}.step-content{display:none}.step-content.active{display:block}.secured-badge{display:flex;align-items:center;gap:6px;font-size:12px;color:#6b7280;margin-top:16px;justify-content:center}.secured-badge svg{width:14px;height:14px}@media (max-width:480px){body{padding:6px}.setup-card{padding:18px;border-radius:24px}.photo-upload{width:80px;height:80px}h1{font-size:20px!important}}@media (max-width:374px){.setup-card{padding:14px}}</style></head><body><div class="setup-card"><div class="logo">🔐</div><h1 class="text-2xl font-bold text-center text-gray-900 mb-1">الإعداد الأولي</h1><p class="text-sm text-gray-500 text-center mb-6">أنشئ حساب المشرف لتشغيل المنصة</p><div class="step-indicator"><div class="step-dot active" id="step-dot-0"></div><div class="step-dot" id="step-dot-1"></div><div class="step-dot" id="step-dot-2"></div><div class="step-dot" id="step-dot-3"></div></div><div class="step-content active" id="step-0"><div class="field-group"><label>اسم المستخدم</label> <input id="s-username" placeholder="أدخل اسم المستخدم" autocomplete="off"><div class="hint">سيستخدم لتسجيل الدخول إلى لوحة الإدارة</div></div><div class="field-group"><label>كلمة المرور</label> <input type="password" id="s-password" placeholder="كلمة مرور قوية (8 أحرف على الأقل)" oninput="checkPasswordStrength(this.value)"><div class="password-strength"><div class="bar" id="pw-bar"></div></div><div id="pw-hint" class="hint">استخدم حروف كبيرة وصغيرة وأرقام ورموز من دون مسافات</div></div><div class="field-group"><label>تأكيد كلمة المرور</label> <input type="password" id="s-password2" placeholder="أعد إدخال كلمة المرور" oninput="checkPasswordMatch()"><div id="pw-match" class="hint"></div></div><button class="btn-primary mt-2" onclick="nextStep(1)">متابعة →</button> <button onclick="window.location.href='/admin.html'" class="w-full mt-2 py-3 rounded-2xl text-sm font-bold text-gray-500 hover:text-gray-700 hover:bg-gray-100 transition-all">⏭ تخطي وفتح لوحة الإدارة</button></div><div class="step-content" id="step-1"><div class="field-group"><label>البريد الإلكتروني</label> <input type="email" id="s-email" placeholder="admin@example.com"></div><div class="field-group"><label>رقم الهاتف</label> <input type="tel" id="s-phone" placeholder="0912345678"></div><div class="field-group"><label>المدينة</label> <input id="s-city" placeholder="طرابلس"></div><div class="flex gap-3 mt-4"><button class="btn-primary !bg-gray-200 !text-gray-600 !shadow-none hover:!bg-gray-300" onclick="prevStep(0)" style="flex:1">→ رجوع</button> <button class="btn-primary" onclick="nextStep(2)" style="flex:1">متابعة →</button></div></div><div class="step-content" id="step-2"><div class="photo-upload" id="photo-upload" onclick="document.getElementById('photo-input').click()"><div class="placeholder" id="photo-placeholder">📷</div><img id="photo-preview" class="hidden"></div><input type="file" id="photo-input" accept="image/*" class="hidden" onchange="previewPhoto(event)"><p class="text-sm text-gray-500 text-center mb-6">اختر صورة شخصية للمشرف (اختياري)</p><div class="flex gap-3 mt-4"><button class="btn-primary !bg-gray-200 !text-gray-600 !shadow-none hover:!bg-gray-300" onclick="prevStep(1)" style="flex:1">→ رجوع</button> <button class="btn-primary" onclick="nextStep(3)" style="flex:1">متابعة →</button></div></div><div class="step-content" id="step-3"><div class="bg-gray-50 rounded-2xl p-5 mb-5 text-sm"><div class="flex items-center gap-3 mb-4"><div class="w-12 h-12 rounded-full bg-gradient-to-br from-amber-400 to-orange-500 flex items-center justify-center text-white font-bold text-lg" id="confirm-avatar">👤</div><div><div class="font-bold text-gray-900" id="confirm-username">—</div><div class="text-gray-500 text-xs" id="confirm-email">—</div></div></div><div class="grid grid-cols-2 gap-3 text-xs"><div><span class="text-gray-400">الهاتف:</span> <span id="confirm-phone" class="font-medium">—</span></div><div><span class="text-gray-400">المدينة:</span> <span id="confirm-city" class="font-medium">—</span></div><div class="col-span-2"><span class="text-gray-400">قوة كلمة المرور:</span> <span id="confirm-pw" class="font-medium text-green-600">—</span></div></div></div><div class="secured-badge mb-4"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg> <span>جميع البيانات ستُشفر وتُحفظ في الخزنة الآمنة (vault)</span></div><button class="btn-primary" id="submit-btn" onclick="submitSetup()"><span id="submit-text">✅ إنشاء حساب المشرف</span> <span id="submit-loading" class="hidden">⏳ جاري الإنشاء...</span></button> <button class="btn-primary !bg-gray-200 !text-gray-600 !shadow-none hover:!bg-gray-300 mt-2" onclick="prevStep(2)" style="flex:1">→ تعديل البيانات</button> <button onclick="window.location.href='/admin.html'" class="w-full mt-2 py-3 rounded-2xl text-sm font-bold text-gray-500 hover:text-gray-700 hover:bg-gray-100 transition-all">⏭ تخطي وفتح لوحة الإدارة</button></div></div><script>const CustomDialog = {
    _overlay: null,
    _resolve: null,
    init() {
        this._overlay = document.getElementById('custom-dialog');
    },
    _getIconHtml(style) {
        const icons = {
            info: ['bg-blue-100','<svg class="w-7 h-7 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M12 2a10 10 0 110 20 10 10 0 010-20z"/></svg>'],
            success: ['bg-emerald-100','<svg class="w-7 h-7 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a10 10 0 11-20 0 10 10 0 0120 0z"/></svg>'],
            warning: ['bg-amber-100','<svg class="w-7 h-7 text-amber-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M10.29 3.86l-8.1 14c-.6 1.04.15 2.14 1.21 2.14h16.2c1.06 0 1.81-1.1 1.21-2.14l-8.1-14c-.6-1.04-1.82-1.04-2.42 0z"/></svg>'],
            error: ['bg-red-100','<svg class="w-7 h-7 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a10 10 0 11-20 0 10 10 0 0120 0z"/></svg>'],
            question: ['bg-purple-100','<svg class="w-7 h-7 text-purple-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M12 2a10 10 0 110 20 10 10 0 010-20z"/></svg>']
        };
        const [bg, icon] = icons[style] || icons.info;
        return '<div class="w-14 h-14 rounded-2xl mx-auto mb-4 flex items-center justify-center text-2xl ' + bg + '">' + icon + '</div>';
    },
    async show({ title, message, type, style, confirmText, cancelText }) {
        type = type || 'alert'; style = style || 'info'; confirmText = confirmText || 'موافق'; cancelText = cancelText || 'إلغاء';
        const overlay = this._overlay;
        overlay.querySelector('#dialog-icon').innerHTML = this._getIconHtml(style);
        overlay.querySelector('#dialog-title').textContent = title || '';
        overlay.querySelector('#dialog-message').textContent = message || '';
        const btnContainer = overlay.querySelector('#dialog-buttons');
        const styleColors = { info: 'bg-blue-600 hover:bg-blue-700', success: 'bg-emerald-600 hover:bg-emerald-700', warning: 'bg-amber-600 hover:bg-amber-700', error: 'bg-red-600 hover:bg-red-700', question: 'bg-purple-600 hover:bg-purple-700' };
        const color = styleColors[style] || styleColors.info;
        return new Promise(resolve => {
            this._resolve = resolve;
            if (type === 'alert') {
                btnContainer.innerHTML = '<button class="flex-1 ' + color + ' text-white py-2.5 rounded-xl text-sm font-medium shadow-md" id="dialog-ok-btn">' + confirmText + '</button>';
                overlay.querySelector('#dialog-ok-btn').onclick = function() { overlay.classList.add('hidden'); resolve(true); };
            } else if (type === 'confirm') {
                btnContainer.innerHTML = '<button class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-600 py-2.5 rounded-xl text-sm font-medium" id="dialog-cancel-btn">' + cancelText + '</button><button class="flex-1 ' + color + ' text-white py-2.5 rounded-xl text-sm font-medium shadow-md" id="dialog-confirm-btn">' + confirmText + '</button>';
                overlay.querySelector('#dialog-confirm-btn').onclick = function() { overlay.classList.add('hidden'); resolve(true); };
                overlay.querySelector('#dialog-cancel-btn').onclick = function() { overlay.classList.add('hidden'); resolve(false); };
            }
            overlay.classList.remove('hidden');
            if (type === 'alert') overlay.querySelector('#dialog-ok-btn').focus();
        });
    },
    async alert(message, title) { return this.show({ title: title || '', message: message || '', type: 'alert', style: 'info' }); },
    async success(message, title) { return this.show({ title: title || '', message: message || '', type: 'alert', style: 'success' }); },
    async error(message, title) { return this.show({ title: title || '', message: message || '', type: 'alert', style: 'error' }); },
    async confirm(message, title) { return this.show({ title: title || 'تأكيد', message: message || '', type: 'confirm', style: 'question', confirmText: 'نعم', cancelText: 'إلغاء' }); }
};
CustomDialog.init();
window.alert = function(m) { CustomDialog.alert(m); };

let currentStep = 0;
let photoBase64 = '';

function checkPasswordStrength(pw) {
  const bar = document.getElementById('pw-bar');
  let score = 0;
  if (pw.length >= 8) score += 25;
  if (pw.match(/[a-z]/)) score += 15;
  if (pw.match(/[A-Z]/)) score += 15;
  if (pw.match(/[0-9]/)) score += 15;
  if (pw.match(/[^a-zA-Z0-9]/)) score += 15;
  if (pw.length >= 12) score += 15;
  const colors = ['#ef4444','#f97316','#eab308','#22c55e','#10b981','#059669'];
  bar.style.width = Math.min(score, 100) + '%';
  bar.style.background = colors[Math.min(Math.floor(score / 17), 5)];
  const hints = ['ضعيفة جداً','ضعيفة','متوسطة','جيدة','قوية','قوية جداً'];
  document.getElementById('pw-hint').textContent = score > 60 ? '✅ ' + hints[Math.min(Math.floor(score / 17), 5)] : 'استخدم حروف كبيرة وصغيرة وأرقام ورموز';
}

function checkPasswordMatch() {
  const p1 = document.getElementById('s-password').value;
  const p2 = document.getElementById('s-password2').value;
  const el = document.getElementById('pw-match');
  if (!p2) { el.textContent = ''; return; }
  el.textContent = p1 === p2 ? '✅ كلمتا المرور متطابقتان' : '❌ كلمتا المرور غير متطابقتين';
  el.style.color = p1 === p2 ? '#10b981' : '#ef4444';
}

function previewPhoto(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    document.getElementById('photo-preview').src = ev.target.result;
    document.getElementById('photo-preview').classList.remove('hidden');
    document.getElementById('photo-placeholder').classList.add('hidden');
    photoBase64 = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function showStep(n) {
  document.querySelectorAll('.step-content').forEach(el => el.classList.remove('active'));
  document.getElementById('step-' + n).classList.add('active');
  document.querySelectorAll('.step-dot').forEach((el, i) => {
    el.classList.remove('active', 'done');
    if (i < n) el.classList.add('done');
    if (i === n) el.classList.add('active');
  });
  currentStep = n;
}

function validateStep(n) {
  if (n === 0) {
    const u = document.getElementById('s-username').value.trim();
    const p1 = document.getElementById('s-password').value;
    const p2 = document.getElementById('s-password2').value;
    if (!u) { alert('يرجى إدخال اسم المستخدم'); return false; }
    if (u.length < 3) { alert('اسم المستخدم يجب أن يكون 3 أحرف على الأقل'); return false; }
    if (!/^[a-zA-Z0-9_\u0600-\u06FF]+$/.test(u)) { alert('اسم المستخدم غير صالح (حروف وأرقام فقط)'); return false; }
    if (p1.length < 8) { alert('كلمة المرور يجب أن تكون 8 أحرف على الأقل'); return false; }
    if (p1 !== p2) { alert('كلمتا المرور غير متطابقتين'); return false; }
    return true;
  }
  if (n === 1) {
    const email = document.getElementById('s-email').value.trim();
    if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { alert('البريد الإلكتروني غير صالح'); return false; }
    return true;
  }
  return true;
}

function nextStep(n) {
  if (!validateStep(currentStep)) return;
  if (n === 3) {
    document.getElementById('confirm-username').textContent = document.getElementById('s-username').value.trim();
    document.getElementById('confirm-email').textContent = document.getElementById('s-email').value.trim() || '(بدون بريد)';
    document.getElementById('confirm-phone').textContent = document.getElementById('s-phone').value.trim() || '(بدون هاتف)';
    document.getElementById('confirm-city').textContent = document.getElementById('s-city').value.trim() || '(بدون مدينة)';
    const pw = document.getElementById('s-password').value;
    const score = Math.min(Math.floor(
      ((pw.length >= 8 ? 25 : 0) + (pw.match(/[a-z]/) ? 15 : 0) + (pw.match(/[A-Z]/) ? 15 : 0) + (pw.match(/[0-9]/) ? 15 : 0) + (pw.match(/[^a-zA-Z0-9]/) ? 15 : 0) + (pw.length >= 12 ? 15 : 0)) / 17
    ), 5);
    const labels = ['ضعيفة جداً','ضعيفة','متوسطة','جيدة','قوية','قوية جداً'];
    document.getElementById('confirm-pw').textContent = labels[score];
    if (photoBase64) document.getElementById('confirm-avatar').innerHTML = '<img src="' + photoBase64 + '" class="w-full h-full rounded-full object-cover">';
  }
  showStep(n);
}

function prevStep(n) { showStep(n); }

async function submitSetup() {
  const btn = document.getElementById('submit-btn');
  const txt = document.getElementById('submit-text');
  const loading = document.getElementById('submit-loading');
  btn.disabled = true;
  txt.classList.add('hidden');
  loading.classList.remove('hidden');

  try {
    const formData = new FormData();
    formData.append('username', document.getElementById('s-username').value.trim());
    formData.append('password', document.getElementById('s-password').value);
    formData.append('email', document.getElementById('s-email').value.trim());
    formData.append('phone', document.getElementById('s-phone').value.trim());
    formData.append('city', document.getElementById('s-city').value.trim());
    if (document.getElementById('photo-input').files[0]) {
      formData.append('photo', document.getElementById('photo-input').files[0]);
    }

    const r = await fetch('/api/setup/admin', { method: 'POST', body: formData });
    const d = await r.json();
    if (d.success) {
      loading.textContent = '✅ تم إنشاء الحساب! جاري التوجيه...';
      setTimeout(function() { window.location.href = '/admin.html'; }, 1500);
    } else {
      alert('❌ ' + d.message);
      btn.disabled = false;
      txt.classList.remove('hidden');
      loading.classList.add('hidden');
    }
  } catch(e) {
    alert('❌ خطأ في الاتصال: ' + e.message);
    btn.disabled = false;
    txt.classList.remove('hidden');
    loading.classList.add('hidden');
  }
}</script><div id="custom-dialog" class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm hidden" onclick="if(event.target===this)this.classList.add('hidden')"><div class="bg-white rounded-3xl w-full max-w-sm shadow-2xl overflow-hidden" style="box-shadow:0 32px 80px rgba(0,0,0,.18)"><div class="p-6 text-center"><div id="dialog-icon" class="w-14 h-14 rounded-2xl mx-auto mb-4 flex items-center justify-center"></div><h3 id="dialog-title" class="text-lg font-bold text-gray-900 mb-2"></h3><p id="dialog-message" class="text-sm text-gray-500 mb-5 leading-relaxed"></p><div id="dialog-buttons" class="flex gap-2"></div></div></div></div></body></html>
